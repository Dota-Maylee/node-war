<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>节点战争</title>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:"Microsoft YaHei",system-ui,sans-serif;overflow:hidden;touch-action:none}
#wrap{display:flex;flex-direction:column;height:100vh;width:100vw}

/* 顶部栏 */
#header{height:48px;min-height:48px;background:#0f172a;border-bottom:1px solid #334155;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;z-index:10}
#header h1{font-size:16px;color:#e2e8f0;letter-spacing:3px;font-weight:700}
#headerLeft{display:flex;align-items:center;gap:10px}
#headerStats{display:flex;gap:20px}
.statBox{text-align:center}
.statBox .num{font-size:18px;font-weight:bold}
.statBox .num.A{color:#38bdf8}
.statBox .lab{font-size:10px;color:#94a3b8;margin-top:2px}
.btn{border:none;border-radius:6px;font-size:12px;font-weight:bold;cursor:pointer;transition:.2s;padding:6px 12px}
.btn-secondary{background:#334155;color:#cbd5e1}
.btn-secondary:hover{background:#475569}

/* 地图 */
#canvasWrap{flex:1;position:relative;background:linear-gradient(160deg,#1e293b 0%,#0f172a 100%);overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}

/* 底部操作面板 */
#bottomPanel{height:240px;min-height:240px;background:#0f172a;border-top:1px solid #334155;display:flex;padding:10px;gap:10px;overflow-x:auto;overflow-y:hidden;flex-shrink:0;align-items:stretch}
.card{background:#1e293b;border-radius:10px;padding:10px;border:1px solid #334155;display:flex;flex-direction:column;min-width:150px;overflow-y:auto}
.card h3{font-size:12px;color:#e2e8f0;margin-bottom:6px;font-weight:600;flex-shrink:0}
.row2{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:12px;border-bottom:1px solid #334155;flex-shrink:0}
.row2:last-child{border:none}
.row2 .k{color:#94a3b8}
.row2 .v{font-weight:bold;color:#fff}
#actionArea{display:none}
.sliderWrap{margin:6px 0;flex-shrink:0}
input[type=range]{width:100%;height:6px;border-radius:3px;background:#334155;outline:none;-webkit-appearance:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#38bdf8;cursor:pointer;border:2px solid #fff}
.btnRow{display:flex;gap:6px;margin-top:6px;flex-shrink:0}
.btn-primary{background:#38bdf8;color:#0f172a}
.btn-primary:hover{background:#7dd3fc}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* 待执行指令卡片 */
#pendingCard{min-width:180px}
#pendingList{font-size:11px;line-height:1.5;flex:1;overflow-y:auto}
.pending-item{display:flex;align-items:center;padding:5px 4px;border-bottom:1px solid #334155;color:#cbd5e1;cursor:grab;user-select:none;gap:4px}
.pending-item:last-child{border:none}
.pending-item.dragging{opacity:0.4;background:#334155}
.pending-item .seq-num{color:#60a5fa;font-weight:bold;min-width:18px;text-align:center}
.pending-item .cancel-btn{margin-left:auto;background:none;border:none;color:#f87171;cursor:pointer;font-size:14px;font-weight:bold;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:4px}
.pending-item .cancel-btn:hover{background:rgba(248,113,113,0.15)}

/* 结束回合固定在右侧 */
.end-turn-area{margin-left:auto;width:140px;min-width:120px;display:flex;align-items:center;justify-content:center;background:#1e293b;border-radius:10px;border:1px solid #334155;padding:10px}
#btnEnd{height:100%;width:100%;background:#f87171;color:#fff;font-size:16px;font-weight:bold;border:none;border-radius:6px;cursor:pointer;transition:.2s}
#btnEnd:hover{background:#fca5a5}
#btnEnd:disabled{opacity:.4;cursor:not-allowed}

/* 弹窗 */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:100}
#overlay.show{display:flex}
#modal{background:#1e293b;padding:24px 32px;border-radius:14px;text-align:center;border:1px solid #475569;max-width:300px}
#modal h2{font-size:24px;margin-bottom:10px}
#modal p{font-size:13px;color:#94a3b8;margin-bottom:20px}
#modal button{padding:8px 24px;font-size:13px}
#rulesOverlay{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:200}
#rulesOverlay.show{display:flex}
#rulesModal{background:#1e293b;padding:20px;border-radius:14px;border:1px solid #475569;max-width:480px;max-height:80vh;overflow-y:auto;color:#e2e8f0}
#rulesModal h2{font-size:18px;margin-bottom:12px;color:#38bdf8}
#rulesModal .rule-section{margin-bottom:10px;font-size:13px;line-height:1.6}
#rulesModal .rule-section b{color:#7dd3fc}

/* 主菜单 */
#mainMenu{position:fixed;inset:0;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:16px}
#mainMenu h1{font-size:32px;color:#e2e8f0;letter-spacing:4px;margin-bottom:20px}
.menu-btn{width:200px;height:48px;font-size:16px}
.menu-desc{font-size:11px;color:#64748b;margin-top:-10px}

/* 匹配菜单 */
#matchMenu{position:fixed;inset:0;background:#0f172a;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:16px;padding:20px}
#matchMenu h2{font-size:24px;color:#e2e8f0;letter-spacing:2px;margin-bottom:10px}
#matchStatus{font-size:16px;color:#fbbf24;margin-top:10px}
#matchSpinner{width:40px;height:40px;border:3px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* 联机菜单（房间对战） */
#onlineMenu{position:fixed;inset:0;background:#0f172a;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:300;gap:16px;padding:20px}
#onlineMenu h2{font-size:24px;color:#e2e8f0;letter-spacing:2px;margin-bottom:10px}
.online-panel{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:20px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.online-panel input{background:#0f172a;border:1px solid #334155;border-radius:6px;padding:10px 12px;color:#e2e8f0;font-size:14px;outline:none}
.online-panel input:focus{border-color:#38bdf8}
.online-panel .online-row{display:flex;gap:8px}
.online-panel .online-row .btn{flex:1}
#roomInfo{display:none;flex-direction:column;gap:8px}
#roomPlayers{font-size:13px;color:#94a3b8;line-height:1.8}
#roomPlayers .ready{color:#4ade80}
#roomPlayers .not-ready{color:#94a3b8}
#onlineStatus{font-size:12px;color:#60a5fa;margin-top:4px;text-align:center}

/* 联机对战顶部信息 */
#onlineBar{position:fixed;top:48px;left:0;right:0;background:rgba(15,23,42,0.9);border-bottom:1px solid #334155;padding:6px 16px;display:none;align-items:center;justify-content:space-between;z-index:9;font-size:12px}
#onlineBar .side-tag{padding:2px 8px;border-radius:4px;font-weight:bold;font-size:11px}
#onlineBar .side-tag.A{background:#38bdf8;color:#0f172a}
#onlineBar .side-tag.B{background:#f87171;color:#fff}
#onlineBar .room-code{color:#94a3b8}
#opponentStatus{font-size:12px;color:#fbbf24}

/* 复盘控制条 */
#replayBar{display:none;position:fixed;bottom:260px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid #475569;border-radius:10px;padding:8px 16px;z-index:150;gap:12px;align-items:center}
#replayTurn{color:#e2e8f0;font-size:13px;font-weight:bold}

@media (max-width: 640px) {
  #header{padding:0 10px}
  #header h1{font-size:14px;letter-spacing:2px}
  #headerStats{gap:12px}
  .statBox .num{font-size:16px}
  #bottomPanel{height:220px;min-height:220px;padding:8px;gap:8px}
  .card{padding:8px;min-width:130px}
  .end-turn-area{width:120px;min-width:100px;padding:8px}
  #btnEnd{font-size:14px}
  #mainMenu h1{font-size:24px}
  .menu-btn{width:180px;height:44px;font-size:14px}
  #matchMenu h2{font-size:20px}
  #onlineMenu h2{font-size:20px}
}
</style>
</head>
<body>

<!-- 主菜单 -->
<div id="mainMenu">
  <h1>节点战争</h1>
  <div id="mainOnlineCount" style="background:#1e293b;border:1px solid #334155;border-radius:8px;padding:8px 16px;font-size:13px;color:#94a3b8;margin-bottom:10px">
    👥 在线人数: <span id="mainOnlineNum" style="color:#38bdf8;font-weight:bold">连接中...</span>
  </div>
  <button class="btn btn-secondary menu-btn" id="btnPvE">人机对战</button>
  <button class="btn btn-secondary menu-btn" id="btnMatch">在线匹配</button>
  <div class="menu-desc">自动匹配当前在线玩家</div>
  <button class="btn btn-secondary menu-btn" id="btnPvP">房间对战</button>
  <div class="menu-desc">创建或加入房间</div>
</div>

<!-- 在线匹配菜单 -->
<div id="matchMenu">
  <h2>在线匹配</h2>
  <div class="online-panel" style="max-width:320px">
    <input type="text" id="inputMatchName" placeholder="输入你的昵称" maxlength="24" value="玩家">
    <div id="matchSpinner" style="display:none"></div>
    <div id="matchStatus">点击开始匹配</div>
    <div class="online-row">
      <button class="btn btn-primary" id="btnStartMatch" style="flex:1">开始匹配</button>
      <button class="btn btn-secondary" id="btnCancelMatch" style="flex:1;display:none">取消匹配</button>
    </div>
  </div>
  <button class="btn btn-secondary menu-btn" id="btnBackFromMatch" style="margin-top:10px;width:200px">返回主菜单</button>
</div>

<!-- 房间对战菜单 -->
<div id="onlineMenu">
  <h2>房间对战</h2>
  <div class="online-panel" id="onlinePanel">
    <input type="text" id="inputName" placeholder="输入你的昵称" maxlength="24" value="玩家">
    <input type="text" id="inputCode" placeholder="输入房间号（留空则创建新房）" maxlength="6" style="text-transform:uppercase">
    <button class="btn btn-primary" id="btnEnterRoom" style="width:100%;margin-top:4px">进入房间</button>
    <div id="roomInfo">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px;font-weight:bold" id="roomCodeDisplay">房间: -</span>
        <span style="font-size:11px;color:#94a3b8" id="roomHostDisplay">房主: -</span>
      </div>
      <div id="roomPlayers"></div>
      <div class="online-row" id="roomActions">
        <button class="btn btn-secondary" id="btnReady">准备</button>
        <button class="btn btn-primary" id="btnStartGame" disabled>开始游戏</button>
        <button class="btn btn-secondary" id="btnLeaveRoom">离开</button>
      </div>
    </div>
    <div id="onlineStatus">未连接</div>
  </div>
  <button class="btn btn-secondary menu-btn" id="btnBackToMain" style="margin-top:10px;width:200px">返回主菜单</button>
</div>

<!-- 联机状态条 -->
<div id="onlineBar">
  <div style="display:flex;gap:10px;align-items:center">
    <span class="side-tag" id="mySideTag">己方</span>
    <span class="room-code" id="onlineRoomCode">房间: -</span>
  </div>
  <span id="opponentStatus">等待对手...</span>
</div>

<div id="wrap">
  <div id="header">
    <div id="headerLeft">
      <h1>节点战争</h1>
      <button class="btn btn-secondary" id="btnRules" style="font-size:11px;padding:4px 10px">规则说明</button>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="btn btn-secondary" id="btnZoomOut" style="padding:2px 8px;font-size:16px;line-height:1">-</button>
        <button class="btn btn-secondary" id="btnZoomIn" style="padding:2px 8px;font-size:16px;line-height:1">+</button>
        <button class="btn btn-secondary" id="btnResetView" style="padding:2px 8px;font-size:12px;line-height:1">复位</button>
      </div>
    </div>
    <div id="headerStats">
      <div class="statBox"><div class="num A" id="sA">-</div><div class="lab">己方领地</div></div>
      <div class="statBox"><div class="num" id="sTurn" style="color:#e2e8f0">1</div><div class="lab">回合</div></div>
    </div>
  </div>

  <div id="canvasWrap"><canvas id="cvs"></canvas></div>

  <div id="bottomPanel">
    <div class="card" id="nodeCard" style="display:none">
      <h3>节点信息</h3>
      <div class="row2"><span class="k">归属</span><span class="v" id="nOwner">-</span></div>
      <div class="row2"><span class="k">兵力</span><span class="v" id="nTroop">-</span></div>
      <div class="row2"><span class="k">上限</span><span class="v" id="nLimit">-</span></div>
      <div class="row2"><span class="k">驻守龄</span><span class="v" id="nAge">-</span></div>
      <div class="row2" id="supplyRow"><span class="k">补给</span><span class="v" id="nSupply">-</span></div>
    </div>

    <div class="card" id="actionArea" style="display:none">
      <h3>移动部队</h3>
      <div class="row2"><span class="k">出发地</span><span class="v" id="aFrom">-</span></div>
      <div class="row2"><span class="k">目标地</span><span class="v" id="aTo">-</span></div>
      <div class="sliderWrap">
        <div class="row2"><span class="k">出兵</span><span class="v" id="aAmt">1</span></div>
        <input type="range" id="rng" min="1" max="1" value="1">
      </div>
      <div class="row2"><span class="k">预计到达</span><span class="v" id="aEst" style="color:#38bdf8">-</span></div>
      <div class="btnRow">
        <button class="btn btn-primary" id="btnMove">确认</button>
        <button class="btn btn-secondary" id="btnCancel">取消</button>
      </div>
    </div>

    <div class="card" id="pendingCard" style="display:none">
      <h3>待执行指令</h3>
      <div id="pendingList"></div>
      <button class="btn btn-secondary" id="btnClearPending" style="margin-top:6px;font-size:11px;padding:4px 8px">清空指令</button>

    <div class="end-turn-area">

<div id="overlay"><div id="modal">
  <h2 id="mTitle">游戏结束</h2>
  <p id="mText">-</p>
  <div style="display:flex;gap:10px;justify-content:center">
    <button class="btn btn-primary" id="btnRestart">再来一局</button>
    <button class="btn btn-secondary" id="btnReplay">全局复盘</button>
  </div>
</div></div>

<!-- 复盘控制条 -->
<div id="replayBar" style="display:none;position:fixed;bottom:260px;left:50%;transform:translateX(-50%);background:#1e293b;border:1px solid #475569;border-radius:10px;padding:8px 16px;z-index:150;gap:12px;align-items:center">
  <span id="replayTurn" style="color:#e2e8f0;font-size:13px;font-weight:bold">第1回合</span>
  <button class="btn btn-secondary" id="btnReplayPrev" style="padding:4px 10px;font-size:12px">上一回合</button>
  <button class="btn btn-primary" id="btnReplayPlay" style="padding:4px 10px;font-size:12px">暂停</button>
  <button class="btn btn-secondary" id="btnReplayNext" style="padding:4px 10px;font-size:12px">下一回合</button>
  <button class="btn btn-secondary" id="btnReplayExit" style="padding:4px 10px;font-size:12px">退出</button>
</div>

<div id="rulesOverlay">
  <div id="rulesModal">
    <h2>游戏规则</h2>
    <div id="rulesContent"></div>
    <button class="btn btn-primary" id="btnCloseRules" style="margin-top:12px;width:100%">关闭</button>
  </div>
</div>

<script>
// ==================== 联机配置 ====================
// ⚠️ 部署后请修改这里：把你的 Render 后端地址填进去
// 示例: const DEFAULT_SERVER = 'https://node-war-server.onrender.com';
const DEFAULT_SERVER = 'https://node-war-production.up.railway.app';
const SERVER_URL = location.hostname === 'localhost' ? 'http://localhost:3000' : (DEFAULT_SERVER || '');

let socket = null;
let mySide = null;
let isOnline = false;
let roomCode = null;
let opponentSubmitted = false;
let iAmReady = false;
let isHost = false;
let isMatchmaking = false;
let gameFromMatchmaking = false;

// ==================== 原始游戏代码 ====================
const cvs = document.getElementById('cvs');
const ctx = cvs.getContext('2d');
let dpr = window.devicePixelRatio || 1;
let W = 800, H = 600;

const view = { scale: 1, minScale: 0.4, maxScale: 3, offsetX: 0, offsetY: 0 };

function resize() {
  const rect = cvs.parentElement.getBoundingClientRect();
  W = Math.max(200, rect.width);
  H = Math.max(200, rect.height);
  cvs.width = Math.floor(W * dpr);
  cvs.height = Math.floor(H * dpr);
  cvs.style.width = W + 'px';
  cvs.style.height = H + 'px';
}
window.addEventListener('resize', () => { resize(); draw(); });

function screenToWorld(sx, sy) {
  return { x: sx / view.scale - view.offsetX, y: sy / view.scale - view.offsetY };
}

function zoomAt(sx, sy, delta) {
  const oldScale = view.scale;
  view.scale = Math.max(view.minScale, Math.min(view.maxScale, view.scale + delta));
  const wx = sx / oldScale - view.offsetX;
  const wy = sy / oldScale - view.offsetY;
  view.offsetX = sx / view.scale - wx;
  view.offsetY = sy / view.scale - wy;
  draw();
}

function zoomCenter(delta) { zoomAt(W / 2, H / 2, delta); }

cvs.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = cvs.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY > 0 ? -0.15 : 0.15);
}, { passive: false });

cvs.addEventListener('contextmenu', e => e.preventDefault());

// ==================== 双指缩放 + 修复 ====================
let isPinching = false, pinchStartDist = 0, pinchStartScale = 1, pinchCenter = { x: 0, y: 0 };
let pinchJustEnded = false; // 修复：标记刚结束双指缩放

cvs.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    isPinching = true;
    pinchJustEnded = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    pinchStartDist = Math.sqrt(dx * dx + dy * dy);
    pinchStartScale = view.scale;
    const rect = cvs.getBoundingClientRect();
    pinchCenter.x = ((e.touches[0].clientX + e.touches[1].clientX) / 2) - rect.left;
    pinchCenter.y = ((e.touches[0].clientY + e.touches[1].clientY) / 2) - rect.top;
  }
}, { passive: false });

cvs.addEventListener('touchmove', e => {
  if (isPinching && e.touches.length === 2) {
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const ratio = dist / pinchStartDist;
    const newScale = Math.max(view.minScale, Math.min(view.maxScale, pinchStartScale * ratio));
    const wx = pinchCenter.x / view.scale - view.offsetX;
    const wy = pinchCenter.y / view.scale - view.offsetY;
    view.offsetX = pinchCenter.x / newScale - wx;
    view.offsetY = pinchCenter.y / newScale - wy;
    view.scale = newScale;
    draw();
  }
}, { passive: false });

cvs.addEventListener('touchend', e => {
  if (e.touches.length < 2) {
    if (isPinching) pinchJustEnded = true; // 修复：标记刚结束pinch
    isPinching = false;
    isDragging = false; // 修复：防止残留拖拽状态
  }
});

const CFG = { N_MIN: 15, N_MAX: 18, INIT: 5 };
let S = { turn: 1, phase: 'player', nodes: [], edges: [], adj: [], sel: null, tgt: null, pending: [], previewDiff: [], previewState: null, aiMoves: [], animParticles: null, over: false, history: [], replayMode: false, replayIndex: 0, replayPlaying: false, replayTimer: null, replayPending: [], replayAiMoves: [] };

function rand(m, M) { return Math.floor(Math.random() * (M - m + 1)) + m }
function dist(a, b) { const dx = a.x - b.x, dy = a.y - b.y; return Math.sqrt(dx * dx + dy * dy) }

// ==================== 种子随机数（联机用）====================
let seededRng = null;
function setSeed(seed) {
  let s = seed;
  seededRng = function() {
    s = (s * 16807 + 0) % 2147483647;
    return (s - 1) / 2147483646;
  };
}
function srnd(m, M) {
  if (seededRng) return Math.floor(seededRng() * (M - m + 1)) + m;
  return rand(m, M);
}
function srand() {
  if (seededRng) return seededRng();
  return Math.random();
}

/* ==================== 地图生成（支持种子）==================== */
function generate(seed, mapW, mapH) {
  if (seed) setSeed(seed);
  const n = srnd(CFG.N_MIN, CFG.N_MAX);
  const nodes = [];
  // 使用传入的尺寸或当前 W/H，确保不受布局时序影响
  const w = mapW || W || window.innerWidth;
  const h = mapH || H || (window.innerHeight - 288);
  const pad = Math.min(w, h) * 0.12;

  const cols = 6, rows = 6;
  const cellW = (w - 2 * pad) / cols;
  const cellH = (h - 2 * pad) / rows;
  const positions = [];

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if ((r === 0 && c === 0) || (r === rows - 1 && c === cols - 1)) continue;
      positions.push({
        x: pad + c * cellW + cellW / 2 + (srand() - 0.5) * cellW * 0.6,
        y: pad + r * cellH + cellH / 2 + (srand() - 0.5) * cellH * 0.6
      });
    }
  }

  for (let i = positions.length - 1; i > 0; i--) {
    const j = Math.floor(srand() * (i + 1));
    [positions[i], positions[j]] = [positions[j], positions[i]];
  }

  const actualN = Math.min(n, positions.length + 2);

  nodes.push({ id: 0, x: pad, y: pad, owner: 'A', isHQ: true, troops: CFG.INIT, age: 0, explA: true, explB: false, sightA: true, sightB: false, supply: true });
  nodes.push({ id: 1, x: w - pad, y: h - pad, owner: 'B', isHQ: true, troops: CFG.INIT, age: 0, explA: false, explB: true, sightA: false, sightB: true, supply: true });

  for (let i = 2; i < actualN; i++) {
    nodes.push({ id: i, x: positions[i - 2].x, y: positions[i - 2].y, owner: null, troops: 0, age: 0, isHQ: false, explA: false, explB: false, sightA: false, sightB: false, supply: false });
  }

  const totalN = nodes.length;
  let D = Array.from({ length: totalN }, () => new Float64Array(totalN));
  for (let i = 0; i < totalN; i++) for (let j = i + 1; j < totalN; j++) D[i][j] = D[j][i] = dist(nodes[i], nodes[j]);

  const edges = [];
  const used = new Set([0]);
  while (used.size < totalN) {
    let best = null, bd = Infinity;
    for (const u of used) for (let v = 0; v < totalN; v++) if (!used.has(v) && D[u][v] < bd) { bd = D[u][v]; best = [u, v]; }
    if (best) { edges.push(best); used.add(best[1]); }
  }

  const adj = Array.from({ length: totalN }, () => []);
  for (const [u, v] of edges) { adj[u].push(v); adj[v].push(u); }

  const hubs = new Set([0, 1]);
  const normalNodes = [];
  for (let i = 2; i < totalN; i++) normalNodes.push(i);
  for (let i = normalNodes.length - 1; i > 0; i--) {
    const j = Math.floor(srand() * (i + 1));
    [normalNodes[i], normalNodes[j]] = [normalNodes[j], normalNodes[i]];
  }
  for (let i = 0; i < Math.min(2, normalNodes.length); i++) hubs.add(normalNodes[i]);

  for (const hub of hubs) {
    const targetDeg = 4;
    const allCandidates = [];
    for (let v = 0; v < totalN; v++) {
      if (v !== hub && !adj[hub].includes(v)) allCandidates.push({ v, d: D[hub][v] });
    }
    allCandidates.sort((a, b) => a.d - b.d);
    for (const cand of allCandidates) {
      if (adj[hub].length >= targetDeg) break;
      const v = cand.v;
      const maxDeg = hubs.has(v) ? 5 : 4;
      if (adj[v].length >= maxDeg) continue;
      edges.push([hub, v]);
      adj[hub].push(v); adj[v].push(hub);
    }
    for (const cand of allCandidates) {
      if (adj[hub].length >= targetDeg) break;
      const v = cand.v;
      if (adj[hub].includes(v)) continue;
      edges.push([hub, v]);
      adj[hub].push(v); adj[v].push(hub);
    }
  }

  const allPairs = [];
  for (let i = 0; i < totalN; i++) {
    for (let j = i + 1; j < totalN; j++) {
      if (!adj[i].includes(j)) allPairs.push([i, j, D[i][j]]);
    }
  }
  allPairs.sort((a, b) => a[2] - b[2]);

  for (const [u, v, d] of allPairs) {
    if (hubs.has(u) || hubs.has(v)) continue;
    const degU = adj[u].length, degV = adj[v].length;
    if (degU >= 3 || degV >= 3) continue;
    if (d > Math.min(w, h) * 0.35) continue;
    edges.push([u, v]);
    adj[u].push(v); adj[v].push(u);
  }

  const uniqueEdges = [];
  const edgeSet = new Set();
  for (const [u, v] of edges) {
    const key = u < v ? u + ',' + v : v + ',' + u;
    if (!edgeSet.has(key)) { edgeSet.add(key); uniqueEdges.push([u, v]); }
  }

  const nodeNeighbors = Array.from({length: totalN}, () => []);
  for (const [u, v] of uniqueEdges) { nodeNeighbors[u].push(v); nodeNeighbors[v].push(u); }

  const nodeAngles = Array.from({length: totalN}, () => ({}));
  for (let n = 0; n < totalN; n++) {
    const neighbors = nodeNeighbors[n];
    if (neighbors.length === 0) continue;
    const sorted = neighbors.map(nb => {
      const dx = nodes[nb].x - nodes[n].x;
      const dy = nodes[nb].y - nodes[n].y;
      return { nb, angle: Math.atan2(dy, dx) };
    }).sort((a, b) => a.angle - b.angle);
    for (let i = 0; i < sorted.length; i++) {
      const baseAngle = sorted[i].angle;
      const spread = Math.min(Math.PI / 4, Math.PI / (sorted.length + 1));
      const offset = (i - (sorted.length - 1) / 2) * spread * 0.5;
      nodeAngles[n][sorted[i].nb] = baseAngle + offset;
    }
  }

  for (let i = 0; i < uniqueEdges.length; i++) {
    const [u, v] = uniqueEdges[i];
    const a = nodes[u], b = nodes[v];
    const angleU = nodeAngles[u][v];
    const angleV = nodeAngles[v][u];

    function curveMinDist(cp, node) {
      let minD = Infinity;
      for (let t = 0.05; t <= 0.95; t += 0.1) {
        const mt = 1 - t;
        const x = mt * mt * cp.startX + 2 * mt * t * cp.x + t * t * cp.endX;
        const y = mt * mt * cp.startY + 2 * mt * t * cp.y + t * t * cp.endY;
        const d = Math.sqrt((x - node.x) ** 2 + (y - node.y) ** 2);
        if (d < minD) minD = d;
      }
      return minD;
    }

    let bestDir = 1, bestMag = 0.25, bestScore = -Infinity;
    const safeR = Math.min(w, h) * 0.026 * 2.5;
    for (const dir of [1, -1]) {
      for (const mag of [0.15, 0.3, 0.45, 0.6]) {
        const cp = getCurveControl(a, b, dir, mag);
        let minDist = Infinity;
        for (let w = 0; w < totalN; w++) {
          if (w === u || w === v) continue;
          const d = curveMinDist(cp, nodes[w]);
          if (d < minDist) minDist = d;
        }
        const score = minDist + (minDist >= safeR ? 30 : 0) - mag * 20;
        if (score > bestScore) { bestScore = score; bestDir = dir; bestMag = mag; }
      }
    }
    uniqueEdges[i][2] = angleU; uniqueEdges[i][3] = angleV; uniqueEdges[i][4] = bestDir; uniqueEdges[i][5] = bestMag;
  }

  const finalAdj = Array.from({ length: totalN }, () => []);
  for (const [u, v] of uniqueEdges) { finalAdj[u].push(v); finalAdj[v].push(u); }

  function bfsDist(start, target, adjList) {
    const q = [[start, 0]]; const vis = new Set([start]);
    while (q.length) {
      const [cur, d] = q.shift();
      if (cur === target) return d;
      for (const nb of adjList[cur]) if (!vis.has(nb)) { vis.add(nb); q.push([nb, d + 1]); }
    }
    return Infinity;
  }

  let dist01 = bfsDist(0, 1, finalAdj);
  let safetyLoop = 0;
  while (dist01 < 3 && safetyLoop < 10) {
    for (let i = uniqueEdges.length - 1; i >= 0; i--) {
      const [u, v] = uniqueEdges[i];
      if ((u === 0 && v === 1) || (u === 1 && v === 0)) uniqueEdges.splice(i, 1);
    }
    const n0 = finalAdj[0], n1 = finalAdj[1];
    for (let i = uniqueEdges.length - 1; i >= 0; i--) {
      const [u, v] = uniqueEdges[i];
      if ((n0.includes(u) && n1.includes(v)) || (n0.includes(v) && n1.includes(u))) uniqueEdges.splice(i, 1);
    }
    for (let i = 0; i < totalN; i++) finalAdj[i] = [];
    for (const [u, v] of uniqueEdges) { finalAdj[u].push(v); finalAdj[v].push(u); }
    dist01 = bfsDist(0, 1, finalAdj);
    safetyLoop++;
  }
  if (dist01 < 3) return generate(seed);

  for (const side of ['A', 'B']) {
    const hq = side === 'A' ? 0 : 1;
    nodes[hq]['sight' + side] = true; nodes[hq]['expl' + side] = true;
    for (const nb of finalAdj[hq]) { nodes[nb]['sight' + side] = true; nodes[nb]['expl' + side] = true; }
  }

  S.nodes = nodes; S.edges = uniqueEdges; S.adj = finalAdj; S.aHQ = 0; S.bHQ = 1;
}

/* ==================== 核心规则 ==================== */
function limit(n) { return 5 + Math.floor(n.age / 2); }
function growth(troops, l) {
  if (troops <= 1) return 0;
  if (troops === 2 || troops === 3) return 1;
  if (troops < l) return Math.min(2, l - troops);
  else if (troops === l) return 0;
  else { const excess = troops - l; return -Math.max(1, Math.ceil(excess / 2)); }
}
function moveLoss(amt) { const loss = Math.floor(amt * 0.25); return Math.max(0, amt - loss); }

function cleanZeroTroops() {
  for (const n of S.nodes) {
    if (n.troops === 0 && n.owner !== null) { n.age = Math.max(0, n.age - 1); n.owner = null; }
  }
}

function updateSupply() {
  for (const n of S.nodes) n.supply = false;
  for (const side of ['A', 'B']) {
    let hqIdx = -1;
    for (let i = 0; i < S.nodes.length; i++) if (S.nodes[i].owner === side && S.nodes[i].isHQ) { hqIdx = i; break; }
    if (hqIdx === -1) continue;
    const visited = new Set(), queue = [hqIdx];
    visited.add(hqIdx);
    while (queue.length > 0) {
      const cur = queue.shift();
      S.nodes[cur].supply = true;
      for (const nb of S.adj[cur]) {
        if (visited.has(nb)) continue;
        const N = S.nodes[nb];
        if (N.owner === side && N.troops > 0) { visited.add(nb); queue.push(nb); }
      }
    }
  }
}

function updateVision() {
  for (const side of ['A', 'B']) {
    for (const n of S.nodes) n['sight' + side] = false;
    for (const n of S.nodes) {
      if (n.owner === side) {
        n['sight' + side] = true; n['expl' + side] = true;
        for (const nb of S.adj[n.id]) { S.nodes[nb]['sight' + side] = true; S.nodes[nb]['expl' + side] = true; }
      }
    }
  }
}

function effectiveOwner(nodeId) {
  if (S.previewState) return S.previewState[nodeId].owner;
  return S.nodes[nodeId].owner;
}
function effectiveTroops(nodeId) {
  if (S.previewState) return S.previewState[nodeId].troops;
  return S.nodes[nodeId].troops;
}
function availableTroops(nodeId) {
  const source = S.previewState ? S.previewState[nodeId] : S.nodes[nodeId];
  if (!source || source.owner !== (isOnline ? mySide : 'A')) return 0;
  if (source.isHQ) return Math.max(0, source.troops - 1);
  return Math.max(0, source.troops);
}

/* ==================== AI ==================== */
function aiDecide(aiNodes = S.nodes) {
  const moves = [];
  const myNodes = aiNodes.filter(n => n.owner === 'B' && n.troops > 0);
  const playerHQVisible = aiNodes[S.aHQ].sightB || aiNodes[S.aHQ].explB;
  const playerHQ = aiNodes[S.aHQ];

  const hq = aiNodes[S.bHQ];
  if (hq.owner === 'B' && hq.troops >= 3) {
    let hasHQMove = false;
    for (const m of moves) if (m.from === S.bHQ) hasHQMove = true;
    if (!hasHQMove) {
      const hqNeighbors = S.adj[S.bHQ].map(id => aiNodes[id]);
      const target = hqNeighbors.find(t => { const perceived = t.sightB ? t.owner : (t.explB ? null : undefined); return perceived === 'A'; })
        || hqNeighbors.find(t => { const perceived = t.sightB ? t.owner : (t.explB ? null : undefined); return perceived === null; });
      if (target) {
        const amt = Math.min(hq.troops - 1, Math.max(2, Math.floor(hq.troops * 0.6)));
        if (amt > 0) moves.push({ from: S.bHQ, to: target.id, amt });
      }
    }
  }

  for (const n of myNodes) {
    if (n.id === S.bHQ) continue;
    const sendMax = n.isHQ ? Math.max(0, n.troops - 1) : n.troops;
    if (sendMax <= 0) continue;
    let best = null, bestSc = -Infinity;
    for (const nb of S.adj[n.id]) {
      const t = aiNodes[nb];
      const sight = t.sightB;
      const known = sight || t.explB;
      const perceivedOwner = sight ? t.owner : (known ? null : undefined);
      const perceivedTroops = sight ? t.troops : (known ? 3 : 0);
      if (perceivedOwner === undefined) continue;
      let sc = 0;
      if (t.isHQ && perceivedOwner === 'A' && sight) sc += 2000;
      else if (perceivedOwner === 'A' && sight) { sc += 300; sc += Math.max(0, 10 - perceivedTroops) * 20; }
      else if (perceivedOwner === null) {
        sc += 120;
        if (playerHQVisible) { const distToPlayerHQ = Math.sqrt((t.x - playerHQ.x)**2 + (t.y - playerHQ.y)**2); sc += Math.max(0, 400 - distToPlayerHQ) * 0.3; }
      }
      else if (t.owner === 'B' && !t.supply) sc += 200;
      else if (t.owner === 'B' && t.troops < 3) sc += 50;
      if (playerHQVisible) { const distToCenter = Math.sqrt((t.x - w/2)**2 + (t.y - h/2)**2); sc -= distToCenter * 0.1; }
      if (perceivedOwner === 'A' && sight && perceivedTroops > n.troops * 0.8) sc -= 150;
      if (sc > bestSc) { bestSc = sc; best = t; }
    }
    if (best && bestSc > -50) {
      let amt;
      const bestSight = best.sightB;
      const bestPerceived = bestSight ? best.owner : (best.explB ? null : undefined);
      if (bestPerceived === 'A' || bestPerceived === null) amt = Math.min(sendMax, Math.max(2, Math.floor(n.troops * 0.7)));
      else amt = Math.min(sendMax, Math.max(1, Math.floor(n.troops * 0.4)));
      if (amt > 0) moves.push({ from: n.id, to: best.id, amt });
    }
  }
  return { moves };
}

/* ==================== 战斗结算 ==================== */
function resolveBattles(nodes, arrivals) {
  for (const nid in arrivals) {
    const N = nodes[nid];
    const A = arrivals[nid];
    const aTot = (N.owner === 'A' ? N.troops : 0) + (A.A || 0);
    const bTot = (N.owner === 'B' ? N.troops : 0) + (A.B || 0);
    let def = null;
    if (N.owner === 'A' && aTot > 0) def = 'A';
    else if (N.owner === 'B' && bTot > 0) def = 'B';
    const aPow = aTot + (def === 'A' ? Math.floor(aTot * 0.25) : 0);
    const bPow = bTot + (def === 'B' ? Math.floor(bTot * 0.25) : 0);
    if (aPow > bPow) {
      if (N.owner !== 'A') N.age = Math.max(0, N.age - 1);
      N.owner = 'A'; N.troops = aTot - bTot;
    } else if (bPow > aPow) {
      if (N.owner !== 'B') N.age = Math.max(0, N.age - 1);
      N.owner = 'B'; N.troops = bTot - aTot;
    } else {
      if (N.owner !== null) N.age = Math.max(0, N.age - 1);
      N.owner = null; N.troops = 0;
    }
  }
}

/* ==================== 预览计算 ==================== */
function recalcPreview() {
  if (S.pending.length === 0) { S.previewState = null; S.previewDiff = []; return; }
  const merged = {};
  for (const move of S.pending) {
    const key = move.from + ',' + move.to;
    if (!merged[key]) merged[key] = { from: move.from, to: move.to, amt: 0 };
    merged[key].amt += move.amt;
  }
  const moves = Object.values(merged);
  const sim = S.nodes.map(n => ({...n}));
  for (const move of moves) {
    const fromNode = sim[move.from];
    if (fromNode.troops < move.amt) continue;
    fromNode.troops -= move.amt;
    const arrive = moveLoss(move.amt);
    if (arrive <= 0) continue;
    const toNode = sim[move.to];
    if (toNode.owner === 'A') toNode.troops += arrive;
    else if (toNode.owner === null) { toNode.owner = 'A'; toNode.troops = arrive; }
    else if (toNode.owner === 'B') {
      const aPow = arrive;
      const bPow = toNode.troops + Math.floor(toNode.troops * 0.25);
      if (aPow > bPow) { toNode.owner = 'A'; toNode.troops = aPow - bPow; }
      else if (bPow > aPow) { toNode.owner = 'B'; toNode.troops = bPow - aPow; }
      else { toNode.owner = null; toNode.troops = 0; }
    }
  }
  for (const n of sim) {
    if (n.troops === 0 && n.owner !== null) { n.age = Math.max(0, n.age - 1); n.owner = null; }
  }
  for (const n of sim) n.supply = false;
  const hqIdx = sim[0].owner === 'A' ? 0 : -1;
  if (hqIdx !== -1) {
    const visited = new Set(), queue = [hqIdx];
    visited.add(hqIdx);
    while (queue.length > 0) {
      const cur = queue.shift();
      sim[cur].supply = true;
      for (const nb of S.adj[cur]) {
        if (visited.has(nb)) continue;
        const N = sim[nb];
        if (N.owner === 'A' && N.troops > 0) { visited.add(nb); queue.push(nb); }
      }
    }
  }
  const nodeInput = new Array(sim.length).fill(0), nodeOutput = new Array(sim.length).fill(0);
  for (const move of moves) { nodeOutput[move.from] += move.amt; nodeInput[move.to] += moveLoss(move.amt); }
  const diffs = [];
  for (let i = 0; i < sim.length; i++) {
    const orig = S.nodes[i];
    if (!orig.explA) continue;
    const diff = nodeInput[i] - nodeOutput[i];
    if (diff !== 0) diffs.push({ id: i, diff: diff });
  }
  S.previewState = sim;
  S.previewDiff = diffs;
}

/* ==================== 动画系统 ==================== */
function playAnimationsParallel(moveGroups, onDone) {
  const hasMoves = moveGroups.some(g => g.moves && g.moves.length > 0);
  if (!hasMoves) { onDone(); return; }
  const particleDuration = 700, stagger = 120;
  const allParticles = [];
  for (const group of moveGroups) {
    const { moves, side } = group;
    if (!moves || moves.length === 0) continue;
    for (const move of moves) {
      const from = S.nodes[move.from], to = S.nodes[move.to];
      let cp = null;
      for (const e of S.edges) {
        if ((e[0] === move.from && e[1] === move.to) || (e[0] === move.to && e[1] === move.from)) {
          cp = getCurveControl(from, to, e[4], e[5]); break;
        }
      }
      if (!cp) { const midX = (from.x + to.x) / 2, midY = (from.y + to.y) / 2; cp = { x: midX, y: midY, startX: from.x, startY: from.y, endX: to.x, endY: to.y }; }
      const count = moveLoss(move.amt);
      for (let j = 0; j < count; j++) {
        allParticles.push({ sx: cp.startX, sy: cp.startY, ex: cp.endX, ey: cp.endY, cp: { x: cp.x, y: cp.y }, side: side, delay: j * stagger, fromId: move.from, toId: move.to });
      }
    }
  }
  if (allParticles.length === 0) { onDone(); return; }
  let maxCount = 0;
  for (const group of moveGroups) {
    if (!group.moves) continue;
    for (const move of group.moves) { const c = moveLoss(move.amt); if (c > maxCount) maxCount = c; }
  }
  const totalDuration = particleDuration + (maxCount - 1) * stagger;
  const startTime = performance.now();
  function frame(now) {
    const elapsed = now - startTime;
    S.animParticles = [];
    for (const p of allParticles) {
      const particleElapsed = elapsed - p.delay;
      if (particleElapsed < 0 || particleElapsed > particleDuration) continue;
      const t = Math.min(particleElapsed / particleDuration, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      const mt = 1 - ease;
      const x = mt * mt * p.sx + 2 * mt * ease * p.cp.x + ease * ease * p.ex;
      const y = mt * mt * p.sy + 2 * mt * ease * p.cp.y + ease * ease * p.ey;
      S.animParticles.push({ x, y, side: p.side, fromId: p.fromId, toId: p.toId });
    }
    draw();
    if (elapsed < totalDuration) requestAnimationFrame(frame);
    else { S.animParticles = null; onDone(); }
  }
  requestAnimationFrame(frame);
}

/* ==================== 结束回合（人机）==================== */
function endTurnResolve() {
  S.sel = null; S.tgt = null; hideAction();
  S.phase = 'animating';
  updateUI();

  const turnRecord = { turn: S.turn, pending: JSON.parse(JSON.stringify(S.pending)), aiMoves: [], beforeState: JSON.parse(JSON.stringify(S.nodes.map(n => ({...n})))), afterState: null };
  let aiMoves = [];
  if (S.previewState) {
    const previewNodes = S.previewState.map(n => ({...n}));
    const AI = aiDecide(previewNodes);
    aiMoves = AI.moves;
  } else {
    const AI = aiDecide();
    aiMoves = AI.moves;
  }
  S.aiMoves = aiMoves;
  turnRecord.aiMoves = JSON.parse(JSON.stringify(aiMoves));

  playAnimationsParallel([{ moves: S.pending, side: 'A' }, { moves: aiMoves, side: 'B' }], () => {
    if (S.previewState) {
      for (let i = 0; i < S.nodes.length; i++) {
        S.nodes[i].owner = S.previewState[i].owner;
        S.nodes[i].troops = S.previewState[i].troops;
        S.nodes[i].age = S.previewState[i].age;
        S.nodes[i].supply = S.previewState[i].supply;
      }
    }
    const arrivals = {};
    for (const move of aiMoves) {
      if (S.nodes[move.from].troops < move.amt) continue;
      S.nodes[move.from].troops -= move.amt;
      const arrive = moveLoss(move.amt);
      if (arrive <= 0) continue;
      if (!arrivals[move.to]) arrivals[move.to] = { A: 0, B: 0 };
      arrivals[move.to].B += arrive;
    }
    resolveBattles(S.nodes, arrivals);
    for (const n of S.nodes) {
      if (n.troops === 0 && n.owner !== null) { n.age = Math.max(0, n.age - 1); n.owner = null; }
      if (n.owner !== null) n.age++;
    }
    for (const n of S.nodes) n.supply = false;
    for (const side of ['A', 'B']) {
      let hqIdx = side === 'A' ? S.aHQ : S.bHQ;
      if (S.nodes[hqIdx].owner !== side) continue;
      const visited = new Set(), queue = [hqIdx];
      visited.add(hqIdx);
      while (queue.length > 0) {
        const cur = queue.shift();
        S.nodes[cur].supply = true;
        for (const nb of S.adj[cur]) {
          if (visited.has(nb)) continue;
          const N = S.nodes[nb];
          if (N.owner === side && N.troops > 0) { visited.add(nb); queue.push(nb); }
        }
      }
    }
    for (const side of ['A', 'B']) {
      for (const n of S.nodes) n['sight' + side] = false;
      for (const n of S.nodes) {
        if (n.owner === side) {
          n['sight' + side] = true; n['expl' + side] = true;
          for (const nb of S.adj[n.id]) { S.nodes[nb]['sight' + side] = true; S.nodes[nb]['expl' + side] = true; }
        }
      }
    }
    for (const n of S.nodes) {
      if (n.owner && n.supply && n.troops > 0) {
        const l = limit(n); const g = growth(n.troops, l);
        n.troops = Math.max(0, n.troops + g);
      }
    }
    turnRecord.afterState = JSON.parse(JSON.stringify(S.nodes.map(n => ({...n}))));
    S.history.push(turnRecord);
    S.pending = []; S.previewDiff = []; S.previewState = null; S.aiMoves = [];
    updatePendingUI();
    const aOwn = S.nodes[S.aHQ].owner === 'A';
    const bOwn = S.nodes[S.bHQ].owner === 'B';
    const aTookB = S.nodes[S.bHQ].owner === 'A';
    const bTookA = S.nodes[S.aHQ].owner === 'B';
    if (aTookB && bTookA) { endGame(null, '双方同时占领对方大本营，平局！'); }
    else if (!aOwn) { endGame(false, 'AI 占领了大本营！'); }
    else if (!bOwn) { endGame(true, '你占领了敌方大本营！'); }
    else { S.turn++; S.phase = 'player'; }
    updateUI(); draw();
  });
}

// ==================== 联机回合结算 ====================
function resolveOnlineTurn(movesA, movesB) {
  S.sel = null; S.tgt = null; hideAction();
  S.phase = 'animating';
  updateUI();

  const turnRecord = { turn: S.turn, pending: JSON.parse(JSON.stringify(mySide === 'A' ? movesA : movesB)), aiMoves: JSON.parse(JSON.stringify(mySide === 'A' ? movesB : movesA)), beforeState: JSON.parse(JSON.stringify(S.nodes.map(n => ({...n})))), afterState: null };

  for (const move of movesA) {
    if (S.nodes[move.from].owner !== 'A') continue;
    if (S.nodes[move.from].troops < move.amt) continue;
    S.nodes[move.from].troops -= move.amt;
    const arrive = moveLoss(move.amt);
    if (arrive <= 0) continue;
    const toNode = S.nodes[move.to];
    if (toNode.owner === 'A') toNode.troops += arrive;
    else if (toNode.owner === null) { toNode.owner = 'A'; toNode.troops = arrive; }
    else if (toNode.owner === 'B') {
      const aPow = arrive;
      const bPow = toNode.troops + Math.floor(toNode.troops * 0.25);
      if (aPow > bPow) { toNode.owner = 'A'; toNode.troops = aPow - bPow; }
      else if (bPow > aPow) { toNode.owner = 'B'; toNode.troops = bPow - aPow; }
      else { toNode.owner = null; toNode.troops = 0; }
    }
  }

  const arrivals = {};
  for (const move of movesB) {
    if (S.nodes[move.from].owner !== 'B') continue;
    if (S.nodes[move.from].troops < move.amt) continue;
    S.nodes[move.from].troops -= move.amt;
    const arrive = moveLoss(move.amt);
    if (arrive <= 0) continue;
    if (!arrivals[move.to]) arrivals[move.to] = { A: 0, B: 0 };
    arrivals[move.to].B += arrive;
  }

  playAnimationsParallel([{ moves: movesA, side: 'A' }, { moves: movesB, side: 'B' }], () => {
    resolveBattles(S.nodes, arrivals);
    for (const n of S.nodes) {
      if (n.troops === 0 && n.owner !== null) { n.age = Math.max(0, n.age - 1); n.owner = null; }
      if (n.owner !== null) n.age++;
    }
    updateSupply();
    updateVision();
    for (const n of S.nodes) {
      if (n.owner && n.supply && n.troops > 0) {
        const l = limit(n); const g = growth(n.troops, l);
        n.troops = Math.max(0, n.troops + g);
      }
    }

    turnRecord.afterState = JSON.parse(JSON.stringify(S.nodes.map(n => ({...n}))));
    S.history.push(turnRecord);
    S.pending = []; S.previewDiff = []; S.previewState = null;
    updatePendingUI();

    const aOwn = S.nodes[S.aHQ].owner === 'A';
    const bOwn = S.nodes[S.bHQ].owner === 'B';
    const aTookB = S.nodes[S.bHQ].owner === 'A';
    const bTookA = S.nodes[S.aHQ].owner === 'B';

    if (aTookB && bTookA) {
      endGameOnline(null, '双方同时占领对方大本营，平局！');
      if (socket) socket.emit('game_over', { winner: null, reason: '平局' });
    } else if (!aOwn) {
      endGameOnline('B', 'A方大本营被占领！');
      if (socket && mySide === 'B') socket.emit('game_over', { winner: 'B', reason: '占领对方大本营' });
    } else if (!bOwn) {
      endGameOnline('A', 'B方大本营被占领！');
      if (socket && mySide === 'A') socket.emit('game_over', { winner: 'A', reason: '占领对方大本营' });
    } else {
      S.turn++; S.phase = 'player';
      opponentSubmitted = false;
      updateOpponentStatus('等待下达指令...');
    }
    updateUI(); draw();
  });
}

function endGame(win, text) {

/* ==================== 复位视图 ==================== */
function resetView() {
  if (!S.nodes || S.nodes.length === 0) return;
  const mySightSide = isOnline ? mySide : 'A';
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  let hasVisible = false;
  for (const n of S.nodes) {
    if (!n['expl' + mySightSide]) continue;
    hasVisible = true;
    minX = Math.min(minX, n.x);
    minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x);
    maxY = Math.max(maxY, n.y);
  }
  if (!hasVisible) return;
  const padding = 80;
  const mapW = maxX - minX + padding * 2;
  const mapH = maxY - minY + padding * 2;
  const scaleX = W / mapW;
  const scaleY = H / mapH;
  view.scale = Math.max(0.5, Math.min(scaleX, scaleY, 1.5));
  view.offsetX = (W / 2 / view.scale) - (minX + maxX) / 2;
  view.offsetY = (H / 2 / view.scale) - (minY + maxY) / 2;
  draw();
}

document.getElementById('btnResetView').addEventListener('click', resetView);

/* ==================== 待执行指令UI ==================== */
function updatePendingUI() {
  const card = document.getElementById('pendingCard');
  const list = document.getElementById('pendingList');
  if (S.pending.length === 0) { card.style.display = 'none'; list.innerHTML = ''; return; }
  card.style.display = 'flex';
  let html = '';
  for (let i = 0; i < S.pending.length; i++) {
    const m = S.pending[i];
    const seqNum = i < 20 ? String.fromCharCode(0x2460 + i) : (i + 1);
    html += '<div class="pending-item" draggable="true" data-index="' + i + '">' +
      '<span class="seq-num">' + seqNum + '</span>' +
      '<span>' + m.amt + '兵</span>' +
      '<button class="cancel-btn" data-index="' + i + '">×</button>' +
      '</div>';
  }
  list.innerHTML = html;
  let dragSrc = null;
  const items = list.querySelectorAll('.pending-item');
  items.forEach(item => {
    item.addEventListener('dragstart', e => { dragSrc = item; item.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', item.dataset.index); });
    item.addEventListener('dragend', e => { item.classList.remove('dragging'); dragSrc = null; });
    item.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; });
    item.addEventListener('drop', e => {
      e.preventDefault();
      const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
      const toItem = e.target.closest('.pending-item');
      if (!toItem) return;
      const toIdx = parseInt(toItem.dataset.index);
      if (fromIdx === toIdx || isNaN(fromIdx) || isNaN(toIdx)) return;
      const item = S.pending.splice(fromIdx, 1)[0];
      let insertIdx = toIdx; if (fromIdx < toIdx) insertIdx--;
      S.pending.splice(insertIdx, 0, item);
      updatePendingUI(); recalcPreview(); draw();
    });
  });
  list.querySelectorAll('.cancel-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(btn.dataset.index);
      S.pending.splice(idx, 1);
      updatePendingUI(); recalcPreview(); draw();
    });
  });
}

<div class="rule-section"><b>战斗规则：</b>两方部队在同一节点相遇时发生战斗。该节点原归属方视为防守方，获得一定兵力加成（加成量＝floor（防守兵力×0.25），向下取整）。兵力高者获胜，剩余兵力为双方差值；若相等则节点变为中立。</div>
<div class="rule-section"><b>兵力上限：</b>上限＝5＋floor（驻守龄／2）</div>

·若T≤1：增长＝0<br>
·若T＝2 或 T＝3：增长＝1<br>
·若4≤T＜L：增长＝min（2，L－T）<br>
·若T＝L：增长＝0<br>
·若T＞L：增长＝－max（1，ceil（（T－L）／2））</div>
<div class="rule-section"><b>补给规则：</b>节点必须能通过一条完全由己方节点组成的路径连通至大本营，才视为有补给。</div>

/* ==================== 曲线控制点 ==================== */
function getCurveControl(a, b, bendDir, bendMag) {
  const startX = a.x, startY = a.y, endX = b.x, endY = b.y;
  const dx = endX - startX, dy = endY - startY;
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len < 1) return { x: (startX + endX) / 2, y: (startY + endY) / 2, startX, startY, endX, endY };
  const midX = (startX + endX) / 2, midY = (startY + endY) / 2;
  const perpX = -dy / len * (bendDir || 1), perpY = dx / len * (bendDir || 1);
  const mag = bendMag || 0.25, offset = len * mag;
  return { x: midX + perpX * offset, y: midY + perpY * offset, startX, startY, endX, endY };
}

/* ==================== 渲染（支持动态阵营视野）==================== */
function draw() {
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.save();
  ctx.setTransform(dpr * view.scale, 0, 0, dpr * view.scale, dpr * view.scale * view.offsetX, dpr * view.scale * view.offsetY);
  const baseR = Math.min(W, H);
  const replayMode = S.replayMode;
  if (replayMode) for (const n of S.nodes) { n.explA = true; n.sightA = true; }

  const mySightSide = isOnline ? mySide : 'A';
  const oppSide = mySightSide === 'A' ? 'B' : 'A';

  for (let ei = 0; ei < S.edges.length; ei++) {
    const [u, v, startAngle, endAngle, bendDir, bendMag] = S.edges[ei];
    const a = S.nodes[u], b = S.nodes[v];
    if (!a['expl' + mySightSide] && !b['expl' + mySightSide]) continue;
    let drawFrom = null;
    if (a['sight' + mySightSide] && b['sight' + mySightSide]) drawFrom = 'full';
    else if (a['sight' + mySightSide] && !b['sight' + mySightSide]) drawFrom = 'halfA';
    else if (!a['sight' + mySightSide] && b['sight' + mySightSide]) drawFrom = 'halfB';
    else continue;
    ctx.strokeStyle = 'rgba(134,239,172,0.55)';
    ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(74,222,128,0.25)';
    ctx.shadowBlur = 6;
    const cp = getCurveControl(a, b, bendDir, bendMag);
    ctx.beginPath();
    if (drawFrom === 'full') { ctx.moveTo(cp.startX, cp.startY); ctx.quadraticCurveTo(cp.x, cp.y, cp.endX, cp.endY); }
    else if (drawFrom === 'halfA') {
      const mx = 0.25 * cp.startX + 0.5 * cp.x + 0.25 * cp.endX;
      const my = 0.25 * cp.startY + 0.5 * cp.y + 0.25 * cp.endY;
      ctx.moveTo(cp.startX, cp.startY); ctx.quadraticCurveTo((cp.startX + cp.x) / 2, (cp.startY + cp.y) / 2, mx, my);
    } else if (drawFrom === 'halfB') {
      const mx = 0.25 * cp.startX + 0.5 * cp.x + 0.25 * cp.endX;
      const my = 0.25 * cp.startY + 0.5 * cp.y + 0.25 * cp.endY;
      ctx.moveTo(cp.endX, cp.endY); ctx.quadraticCurveTo((cp.endX + cp.x) / 2, (cp.endY + cp.y) / 2, mx, my);
    }
    ctx.stroke(); ctx.shadowBlur = 0;
  }

  const drawOps = replayMode ? S.replayPending : S.pending;
  const drawPhase = replayMode ? 'replay' : S.phase;
  if ((drawPhase === 'player' || drawPhase === 'replay') && !S.over) {
    for (let i = 0; i < drawOps.length; i++) {
      const m = drawOps[i];
      const a = S.nodes[m.from], b = S.nodes[m.to];
      if (!a['sight' + mySightSide]) continue;
      const arrowAngle = Math.atan2(b.y - a.y, b.x - a.x);
      const sx = a.x, sy = a.y, ex = b.x, ey = b.y;
      ctx.strokeStyle = 'rgba(96, 165, 250, 0.75)';
      ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke(); ctx.setLineDash([]);
      const rTo = b.isHQ ? baseR * 0.038 : baseR * 0.026;
      const tipX = b.x - Math.cos(arrowAngle) * (rTo + 3);
      const tipY = b.y - Math.sin(arrowAngle) * (rTo + 3);
      const al = 10, aa = 0.4;
      ctx.fillStyle = 'rgba(96, 165, 250, 0.75)';
      ctx.beginPath();
      ctx.moveTo(tipX, tipY);
      ctx.lineTo(tipX - al * Math.cos(arrowAngle - aa), tipY - al * Math.sin(arrowAngle - aa));
      ctx.lineTo(tipX - al * Math.cos(arrowAngle + aa), tipY - al * Math.sin(arrowAngle + aa));
      ctx.closePath(); ctx.fill();
      const mx = (sx + ex) / 2, my = (sy + ey) / 2;
      const perpX = -Math.sin(arrowAngle), perpY = Math.cos(arrowAngle);
      const lx = mx + perpX * 14, ly = my + perpY * 14;
      const seqNum = i < 20 ? String.fromCharCode(0x2460 + i) : (i + 1);
      const labelText = seqNum + ' ' + m.amt + '兵';
      ctx.font = 'bold 11px sans-serif';
      const tw = ctx.measureText(labelText).width;
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillRect(lx - tw / 2 - 4, ly - 8, tw + 8, 16);
      ctx.fillStyle = '#60a5fa'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(labelText, lx, ly);
    }
  }

  for (const n of S.nodes) {
    if (!n['expl' + mySightSide]) continue;
    const sight = replayMode ? true : n['sight' + mySightSide];
    const l = limit(n);
    const overLimit = sight && n.troops > l;
    let fill = '#1e293b';
    if (sight) {
      if (overLimit) { if (n.owner === oppSide) fill = '#a855f7'; else fill = '#facc15'; }
      else if (n.owner === 'A') fill = '#38bdf8';
      else if (n.owner === 'B') fill = '#f87171';
      else fill = '#64748b';
    }
    const r = n.isHQ ? baseR * 0.038 : baseR * 0.026;
    if (n.id === S.sel?.id || n.id === S.tgt?.id) {
      ctx.shadowColor = n.id === S.sel?.id ? '#fff' : '#4ade80';
      ctx.shadowBlur = 15;
    } else { ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 8; }
    ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 2;
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.lineWidth = n.isHQ ? 3 : 1.5;
    if (n.id === S.sel?.id) ctx.strokeStyle = '#fff';
    else if (n.id === S.tgt?.id) ctx.strokeStyle = '#4ade80';
    else ctx.strokeStyle = n.isHQ ? '#fbbf24' : '#0f172a';
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2); ctx.stroke();

    if (n.isHQ && sight) {
      ctx.fillStyle = n.owner === 'A' ? '#38bdf8' : (n.owner === 'B' ? '#f87171' : '#94a3b8');
      ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('大本营', n.x, n.y - r - 8);
    }
    if (sight && n.owner === mySightSide && !n.supply) {
      ctx.fillStyle = '#f97316'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('断粮', n.x, n.y - r - (n.isHQ ? 20 : 8));
    }
    if (sight && n.troops > 0) {
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(n.troops, n.x, n.y);
    } else if (!sight && n['expl' + mySightSide]) {
      ctx.fillStyle = '#475569'; ctx.font = '12px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('?', n.x, n.y);
    }
    if (S.previewDiff && S.previewDiff.length > 0 && S.phase === 'player' && n['expl' + mySightSide]) {
      const change = S.previewDiff.find(p => p.id === n.id);
      if (change) {
        const isGain = change.diff > 0;
        ctx.fillStyle = isGain ? 'rgba(134, 239, 172, 0.95)' : 'rgba(252, 165, 165, 0.95)';
        ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
        const sign = isGain ? '+' : '';
        ctx.fillText(sign + change.diff, n.x, n.y - r - (n.isHQ && !n.supply ? 22 : (n.isHQ ? 10 : 4)));
      }
    }
  }

  if (S.animParticles && S.animParticles.length > 0) {
    for (const p of S.animParticles) {
      if (!p) continue;
      const fromNode = S.nodes[p.fromId], toNode = S.nodes[p.toId];
      let visible = false;
      if (replayMode) visible = true;
      else if (p.side === mySightSide) visible = fromNode['sight' + mySightSide];
      else visible = fromNode['sight' + mySightSide] || toNode['sight' + mySightSide];
      if (!visible) continue;
      ctx.fillStyle = p.side === 'A' ? '#38bdf8' : '#f87171';
      ctx.shadowColor = p.side === 'A' ? '#38bdf8' : '#f87171';
      ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(p.x, p.y, 5.5, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#e0f2fe';
      ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
}

function hit(wx, wy) {
  const hitR = 40 / view.scale;
  for (const n of S.nodes) {
    if (!n['expl' + (isOnline ? mySide : 'A')]) continue;
    const dx = wx - n.x, dy = wy - n.y;
    if (dx * dx + dy * dy < hitR * hitR) return n;
  }
  return null;
}

/* ==================== 交互（修复双指缩放残留拖拽）==================== */
function getPos(e) { const r = cvs.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
let isDragging = false, dragStart = { x: 0, y: 0 }, dragViewStart = { x: 0, y: 0 };

cvs.addEventListener('pointerdown', e => {
  if (S.over || isPinching || S.phase === 'animating') return;
  // 修复：双指缩放期间不启动拖拽
  if (e.pointerType === 'touch' && isPinching) return;
  e.preventDefault(); cvs.setPointerCapture(e.pointerId);
  isDragging = false; dragStart.x = e.clientX; dragStart.y = e.clientY;
  dragViewStart.x = view.offsetX; dragViewStart.y = view.offsetY;
});

window.addEventListener('pointermove', e => {
  if (isPinching) return;
  // 修复：刚结束双指缩放时，忽略这次移动防止跳跃
  if (pinchJustEnded) {
    pinchJustEnded = false;
    isDragging = false;
    return;
  }
  if (!cvs.hasPointerCapture(e.pointerId)) return;
  const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
  if (!isDragging && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) { isDragging = true; cvs.style.cursor = 'grabbing'; }
  if (isDragging) { view.offsetX = dragViewStart.x + dx / view.scale; view.offsetY = dragViewStart.y + dy / view.scale; draw(); }
});

window.addEventListener('pointerup', e => {
  if (!cvs.hasPointerCapture(e.pointerId)) return;
  cvs.releasePointerCapture(e.pointerId); cvs.style.cursor = '';
  if (isPinching) { isDragging = false; return; }
  if (!isDragging && !isPinching && S.phase === 'player' && !S.over) handleCanvasClick(e);
  isDragging = false;
});

window.addEventListener('pointercancel', e => {
  if (!cvs.hasPointerCapture(e.pointerId)) return;
  cvs.releasePointerCapture(e.pointerId); cvs.style.cursor = '';
  isDragging = false; isPinching = false; pinchJustEnded = false;
});

function handleCanvasClick(e) {
  if (e.button === 2) return;
  const p = getPos(e);
  const w = screenToWorld(p.x, p.y);
  const n = hit(w.x, w.y);
  if (!n) { S.sel = null; S.tgt = null; hideAction(); document.getElementById('nodeCard').style.display = 'none'; draw(); return; }
  const effOwner = effectiveOwner(n.id);
  const playableSide = isOnline ? mySide : 'A';

  if (!S.sel) {
    if (effOwner === playableSide && availableTroops(n.id) >= 1) { S.sel = n; showNodeInfo(n); }
    else { document.getElementById('nodeCard').style.display = 'none'; }
  } else if (!S.tgt) {
    if (n.id === S.sel.id) { S.sel = null; document.getElementById('nodeCard').style.display = 'none'; }
    else if (n['expl' + playableSide] && S.adj[S.sel.id].includes(n.id)) { S.tgt = n; showNodeInfo(n); showAction(); }
    else { S.sel = null; document.getElementById('nodeCard').style.display = 'none'; }
  } else {
    if (n.id === S.sel.id || n.id === S.tgt.id) { S.sel = null; S.tgt = null; hideAction(); document.getElementById('nodeCard').style.display = 'none'; }
    else if (effOwner === playableSide && availableTroops(n.id) >= 1) { S.sel = n; S.tgt = null; hideAction(); showNodeInfo(n); }
    else { S.sel = null; S.tgt = null; hideAction(); document.getElementById('nodeCard').style.display = 'none'; }
  }
  draw();
}

}

document.getElementById('btnMove').onclick = () => {

// ==================== Socket.IO 联机逻辑 ====================
function initSocket() {
  if (socket) return;
  if (!SERVER_URL) {
    alert('后端地址未配置，请联系管理员');
    return;
  }
  socket = io(SERVER_URL);
  socket.on('connect', () => { 
    updateOnlineStatus('已连接'); 
  });
  socket.on('connect_error', (err) => { 
    console.error('连接失败:', err.message); 
    updateOnlineStatus('连接失败'); 
    const el = document.getElementById('mainOnlineNum');
    if (el) { el.textContent = '离线'; el.style.color = '#f87171'; }
  });
  socket.on('online_count', (count) => {
    const el = document.getElementById('mainOnlineNum');
    if (el) { el.textContent = count; el.style.color = '#38bdf8'; }
  });
  socket.on('disconnect', () => { updateOnlineStatus('已断开'); });
  socket.on('error_msg', (data) => { alert(data.message || '操作失败'); });

  socket.on('match_found', (data) => {
    isMatchmaking = false;
    mySide = data.yourSide;
    roomCode = data.room.code;
    document.getElementById('matchMenu').style.display = 'none';
    startOnlineGame(data.seed, data.opponent);
  });

  socket.on('matchmaking_joined', () => {
    document.getElementById('matchStatus').textContent = '正在匹配对手...';
  });

  socket.on('matchmaking_left', () => {
    document.getElementById('matchStatus').textContent = '已取消匹配';
  });

  socket.on('room_created', (data) => {
    roomCode = data.code; isHost = true; iAmReady = false;
    updateRoomUI(data.room);
  });
  socket.on('room_joined', (data) => {
    roomCode = data.code; isHost = false; iAmReady = false;
    updateRoomUI(data.room);
  });
  socket.on('player_joined', (data) => { updateRoomUI(data.room); });
  socket.on('player_left', (data) => { updateRoomUI(data.room); });
  socket.on('player_ready', (data) => { updateRoomUI(data.room); });
  socket.on('host_changed', (data) => { if (socket.id === data.newHost) isHost = true; updateRoomUI(data.room); });

  socket.on('game_started', (data) => {
    mySide = data.yourSide;
    roomCode = data.room.code;
    document.getElementById('onlineMenu').style.display = 'none';
    startOnlineGame(data.seed);
  });

  socket.on('opponent_submitted', () => {
    opponentSubmitted = true;
    updateOpponentStatus('对手已提交');
  });

  socket.on('turn_resolved', (data) => {
    resolveOnlineTurn(data.movesA, data.movesB);
  });

  socket.on('game_over', (data) => {
    if (S.over) return;
    endGameOnline(data.winner, data.reason);
  });

  socket.on('room_reset', (data) => {
    document.getElementById('wrap').style.display = 'none';
    document.getElementById('onlineMenu').style.display = 'flex';
    document.getElementById('onlineBar').style.display = 'none';
    updateRoomUI(data.room);
  });
}

/* ==================== 复盘功能 ==================== */
let replaySessionId = 0;
function startReplay() {
  if (!S.history || S.history.length === 0) return;
  S.replayMode = true; S.replayIndex = 0; S.replayPlaying = true; S.replayAnimating = false;
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('replayBar').style.display = 'flex';
  document.getElementById('btnReplayPlay').textContent = '暂停';
  if (S.replayTimer) { clearTimeout(S.replayTimer); S.replayTimer = null; }
  replayGo(0);
}
function stopReplay() {
  replaySessionId++;
  S.replayMode = false; S.replayPlaying = false; S.replayAnimating = false;
  S.animParticles = null; if (S.replayTimer) { clearTimeout(S.replayTimer); S.replayTimer = null; }
  document.getElementById('replayBar').style.display = 'none';
  backToMainMenu();
}
function replayGo(index) {
  if (!S.replayMode) return; replaySessionId++; const mySession = replaySessionId;
  S.sel = null; S.tgt = null; document.getElementById('nodeCard').style.display = 'none'; hideAction();
  S.animParticles = null; S.replayAnimating = false;
  if (S.replayTimer) { clearTimeout(S.replayTimer); S.replayTimer = null; }
  S.replayIndex = index;
  if (index < S.history.length) {
    const rec = S.history[index];
    for (let i = 0; i < rec.beforeState.length && i < S.nodes.length; i++) S.nodes[i] = { ...rec.beforeState[i] };
    for (const n of S.nodes) { n.explA = true; n.sightA = true; }
    S.replayPending = rec.pending; S.replayAiMoves = rec.aiMoves;
    updateReplayUI(); draw();
    if (S.replayPlaying) replayPlayTurn(mySession);
  } else if (index === S.history.length) {
    const lastRec = S.history[S.history.length - 1];
    if (lastRec && lastRec.afterState) for (let i = 0; i < lastRec.afterState.length && i < S.nodes.length; i++) S.nodes[i] = { ...lastRec.afterState[i] };
    for (const n of S.nodes) { n.explA = true; n.sightA = true; }
    S.replayPending = []; S.replayAiMoves = [];
    S.replayPlaying = false;
    document.getElementById('btnReplayPlay').textContent = '播放';
    updateReplayUI(); draw();
  }
}
function replayPlayTurn(sessionId) {
  if (sessionId !== replaySessionId) return;
  S.replayAnimating = true; updateReplayUI();
  const rec = S.history[S.replayIndex];
  playAnimationsParallel([{ moves: rec.pending, side: 'A' }, { moves: rec.aiMoves, side: 'B' }], () => {
    if (sessionId !== replaySessionId) return;
    applyReplayPlayerMoves(rec.pending);
    applyReplayAIMoves(rec.aiMoves);
    finishReplayTurn();
    S.replayAnimating = false; updateReplayUI(); draw();
    if (S.replayPlaying && sessionId === replaySessionId) {
      if (S.replayIndex < S.history.length - 1) {
        S.replayTimer = setTimeout(() => { if (sessionId === replaySessionId && S.replayPlaying) replayGo(S.replayIndex + 1); }, 1500);
      } else {
        S.replayTimer = setTimeout(() => { if (sessionId === replaySessionId && S.replayPlaying) replayGo(S.history.length); }, 1500);
      }
    }
  });
}
function applyReplayPlayerMoves(moves) {
  if (!moves || moves.length === 0) return;
  const merged = {};
  for (const move of moves) { const key = move.from + ',' + move.to; if (!merged[key]) merged[key] = { from: move.from, to: move.to, amt: 0 }; merged[key].amt += move.amt; }
  for (const move of Object.values(merged)) {
    const fromNode = S.nodes[move.from]; if (fromNode.troops < move.amt) continue;
    fromNode.troops -= move.amt; const arrive = moveLoss(move.amt); if (arrive <= 0) continue;
    const toNode = S.nodes[move.to];
    if (toNode.owner === 'A') toNode.troops += arrive;
    else if (toNode.owner === null) { toNode.owner = 'A'; toNode.troops = arrive; }
    else if (toNode.owner === 'B') {
      const aPow = arrive; const bPow = toNode.troops + Math.floor(toNode.troops * 0.25);
      if (aPow > bPow) { toNode.owner = 'A'; toNode.troops = aPow - bPow; }
      else if (bPow > aPow) { toNode.owner = 'B'; toNode.troops = bPow - aPow; }
      else { toNode.owner = null; toNode.troops = 0; }
    }
  }
}
function applyReplayAIMoves(moves) {
  if (!moves || moves.length === 0) return;
  const arrivals = {};
  for (const move of moves) {
    if (S.nodes[move.from].troops < move.amt) continue;
    S.nodes[move.from].troops -= move.amt;
    const arrive = moveLoss(move.amt); if (arrive <= 0) continue;
    if (!arrivals[move.to]) arrivals[move.to] = { A: 0, B: 0 };
    arrivals[move.to].B += arrive;
  }
  resolveBattles(S.nodes, arrivals);
}
function finishReplayTurn() {
  for (const n of S.nodes) {
    if (n.troops === 0 && n.owner !== null) { n.age = Math.max(0, n.age - 1); n.owner = null; }
    if (n.owner !== null) n.age++;
  }
  updateSupply(); updateVision();
  for (const n of S.nodes) {
    if (n.owner && n.supply && n.troops > 0) { const l = limit(n); const g = growth(n.troops, l); n.troops = Math.max(0, n.troops + g); }
  }
  for (const n of S.nodes) { n.explA = true; n.sightA = true; }
}
function replayPrev() { if (S.replayAnimating) return; if (S.replayIndex > 0) replayGo(S.replayIndex - 1); }
function replayNext() { if (S.replayAnimating) return; if (S.replayIndex < S.history.length) replayGo(S.replayIndex + 1); }
function toggleReplayPlay() {
  if (S.replayAnimating) return;
  S.replayPlaying = !S.replayPlaying;
  document.getElementById('btnReplayPlay').textContent = S.replayPlaying ? '暂停' : '播放';
  if (S.replayPlaying) { if (S.replayIndex >= S.history.length) replayGo(0); else replayPlayTurn(replaySessionId); }
  else { if (S.replayTimer) { clearTimeout(S.replayTimer); S.replayTimer = null; } }
}
function updateReplayUI() {
  if (S.replayIndex < S.history.length) {
    const rec = S.history[S.replayIndex];
    document.getElementById('replayTurn').textContent = '第' + (rec ? rec.turn : '?') + '回合' + (S.replayAnimating ? ' (播放中)' : '');
  } else { document.getElementById('replayTurn').textContent = '最终状态'; }
  document.getElementById('btnReplayPrev').disabled = S.replayIndex <= 0 || S.replayAnimating;
  document.getElementById('btnReplayNext').disabled = S.replayAnimating;
  document.getElementById('btnReplayPlay').disabled = S.replayAnimating;
}

/* ==================== 启动 ==================== */
function init() {
  document.getElementById('wrap').style.display = 'none';
  setTimeout(() => {
    if (!socket && SERVER_URL) initSocket();
  }, 300);
}
setTimeout(init, 150);
</script>
